[project]
name = "inferforge"
version = "0.1.0"
description = "Self-hosted inference stack for Triton/TensorRT embedding and vision models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.0",
    "fastapi>=0.118.0",
    "httpx>=0.28.1",
    "numpy>=1.26.4",
    "onnx>=1.19.1",
    "onnxruntime>=1.23.1",
    "pillow>=11.3.0",
    "prometheus-client>=0.23.1",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.10.1",
    "python-json-logger>=4.0.0",
    "pyyaml>=6.0",
    "redis>=6.4.0",
    "torch>=2.8.0",
    "tritonclient[grpc]>=2.51.0",
    "transformers>=4.57.1",
    "uvicorn>=0.37.0",
    "minio>=7.2.20",
]


[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "requests>=2.32.5",
    "ruff>=0.13.3",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20250913",
]
perf = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
exclude = "(model_repository/.*/1/|models/scripts/|weights/)"
ignore_missing_imports = true
explicit_package_bases = true
