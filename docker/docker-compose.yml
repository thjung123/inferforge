services:
  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  triton:
    container_name: triton
    build:
      context: ..
      dockerfile: docker/Dockerfile.triton
    volumes:
      - ../model_repository:/models
    # prod: --model-repository=s3://http://minio:9000/model-repository (needs AWS_* creds)
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"

  builder:
    container_name: builder
    build:
      context: ..
      dockerfile: docker/Dockerfile.builder
    volumes:
      - ../model_repository:/models
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MODEL_REPOSITORY=/models
      - TRITON_HTTP_URL=http://triton:8000
      - PUSH_TO_OBJECT_STORE=true
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MODEL_BUCKET=model-repository
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - redis
      - triton
      - minio

  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    container_name: gateway
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_KEY_WHITELIST=${API_KEY_WHITELIST:-["test-key"]}
      - JWT_SECRET=${JWT_SECRET:-}
      - TRITON_URL=triton:8001
      - TRITON_HTTP_URL=http://triton:8000
      - BUILDER_URL=http://builder:8090
    depends_on:
      - redis
      - triton
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  minio_data:
  redis_data:
