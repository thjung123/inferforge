model_type: bert
source: "google-bert/bert-base-uncased"
model_name: bert_encoder

triton:
  max_batch_size: 256
  instance_count: 1

# dynamic batch, fixed seq len 128
inputs:
  - name: input_ids
    shape: [-1, 128]
    datatype: INT32
  - name: attention_mask
    shape: [-1, 128]
    datatype: INT32
  - name: token_type_ids
    shape: [-1, 128]
    datatype: INT32

outputs:
  - name: last_hidden_state
    shape: [-1, 128, 768]
    datatype: FP32

precision:
  default: fp16
  validation:
    min_cosine: 0.999
    max_abs_err: 0.05
    num_samples: 8

# only batch dim is dynamic
dynamic_shapes:
  enabled: true
  input_ids:
    min: [1, 128]
    opt: [4, 128]
    max: [256, 128]
  attention_mask:
    min: [1, 128]
    opt: [4, 128]
    max: [256, 128]
  token_type_ids:
    min: [1, 128]
    opt: [4, 128]
    max: [256, 128]

ensemble:
  name: bert_ensemble
  max_batch_size: 256
  inputs:
    - name: TEXTS
      datatype: STRING
      dims: [-1]
  outputs:
    - name: bert_emb
      datatype: FP32
      dims: [768]
  steps:
    - model_name: bert_preprocessor
      backend: python
      instance_kind: KIND_CPU
      params:
        max_length: 128
      inputs:
        - name: TEXTS
          datatype: STRING
          dims: [-1]
      outputs:
        - name: INPUT_IDS
          datatype: INT32
        - name: ATTENTION_MASK
          datatype: INT32
        - name: TOKEN_TYPE_IDS
          datatype: INT32
      input_map:
        TEXTS: TEXTS
      output_map:
        INPUT_IDS: INPUT_IDS
        ATTENTION_MASK: ATTENTION_MASK
        TOKEN_TYPE_IDS: TOKEN_TYPE_IDS
    - model_name: bert_encoder
      input_map:
        input_ids: INPUT_IDS
        attention_mask: ATTENTION_MASK
        token_type_ids: TOKEN_TYPE_IDS
      output_map:
        last_hidden_state: last_hidden_state
    - model_name: bert_postprocessor
      backend: python
      instance_kind: KIND_CPU
      inputs:
        - name: last_hidden_state
          datatype: FP32
          dims: [128, 768]
        - name: attention_mask
          datatype: INT32
          dims: [128]
      outputs:
        - name: bert_emb
          datatype: FP32
          dims: [768]
      input_map:
        last_hidden_state: last_hidden_state
        attention_mask: ATTENTION_MASK
      output_map:
        bert_emb: bert_emb
