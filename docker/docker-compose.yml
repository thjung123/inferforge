services:
  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  triton:
    container_name: triton
    build:
      context: ..
      dockerfile: docker/Dockerfile.triton
    volumes:
      - ../model_repository:/models
    # prod: --model-repository=s3://http://minio:9000/model-repository (needs AWS_* creds)
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"

  builder:
    container_name: builder
    build:
      context: ..
      dockerfile: docker/Dockerfile.builder
    volumes:
      - ../model_repository:/models
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MODEL_REPOSITORY=/models
      - TRITON_HTTP_URL=http://triton:8000
      - PUSH_TO_OBJECT_STORE=true
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MODEL_BUCKET=model-repository
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - redis
      - triton
      - minio

  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  vllm-primary:
    container_name: vllm-primary
    image: vllm/vllm-openai:v0.24.0
    command:
      - "--model"
      - "${VLLM_PRIMARY_MODEL:-Qwen/Qwen2.5-7B-Instruct}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8100"
      - "--max-model-len"
      - "${VLLM_PRIMARY_MAX_MODEL_LEN:-4096}"
      - "--enable-lora"
    environment:
      - VLLM_ALLOW_RUNTIME_LORA_UPDATING=True
    volumes:
      - hf_cache:/root/.cache/huggingface
      - lora_adapters:/adapters
    shm_size: 4g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    expose:
      - "8100"

  vllm-fallback:
    container_name: vllm-fallback
    image: vllm/vllm-openai:v0.24.0
    command:
      - "--model"
      - "${VLLM_FALLBACK_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8101"
      - "--max-model-len"
      - "${VLLM_FALLBACK_MAX_MODEL_LEN:-4096}"
    environment:
      - VLLM_ALLOW_RUNTIME_LORA_UPDATING=True
    volumes:
      - hf_cache:/root/.cache/huggingface
    shm_size: 2g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    expose:
      - "8101"

  gateway:
    container_name: gateway
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_KEY_WHITELIST=${API_KEY_WHITELIST:-["test-key"]}
      - JWT_SECRET=${JWT_SECRET:-}
      - TRITON_URL=triton:8001
      - TRITON_HTTP_URL=http://triton:8000
      - BUILDER_URL=http://builder:8090
      - VLLM_PRIMARY_URL=http://vllm-primary:8100
      - VLLM_FALLBACK_URL=http://vllm-fallback:8101
    depends_on:
      - redis
      - triton
      - vllm-primary
      - vllm-fallback
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  lora-sync:
    container_name: lora-sync
    build:
      context: ..
      dockerfile: docker/Dockerfile.lora-sync
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=lora-adapters
      - VLLM_URL=http://vllm-primary:8100
      - ADAPTER_DIR=/adapters
    volumes:
      - lora_adapters:/adapters
    depends_on:
      - redis
      - minio
      - vllm-primary
    restart: unless-stopped

volumes:
  hf_cache:
  minio_data:
  lora_adapters:
  redis_data:
